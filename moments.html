  <style>
    :root {
      --navy:    #004489;
      --sky:     #0087ca;
      --cream:   #F3F2F1;
      --gold:    #C9984A;
      --charcoal:#1e1e2e;
      --white:   #ffffff;
      --ease:    cubic-bezier(0.4, 0, 0.2, 1);
    }

    body { background-color: var(--cream); font-family: 'DM Sans', sans-serif; }

    /* ── HERO ── */
    .moments-hero {
      background: linear-gradient(150deg, var(--navy) 0%, #003370 45%, #005aa8 100%);
      padding: 90px 20px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .moments-hero::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 54px;
      background: var(--cream);
      clip-path: ellipse(55% 100% at 50% 100%);
    }
    .moments-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 30%, rgba(201,152,74,0.2) 0%, transparent 55%);
    }
    .moments-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 900;
      color: var(--white);
      letter-spacing: -1.5px;
      line-height: 1.1;
      position: relative;
    }
    .moments-hero h1 em {
      color: var(--gold);
      font-style: italic;
      font-weight: 700;
    }
    .moments-hero .sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.68);
      margin-top: 14px;
      font-weight: 300;
      letter-spacing: 1px;
      position: relative;
    }
    .hero-divider {
      width: 48px; height: 3px;
      background: var(--gold);
      border-radius: 2px;
      margin: 22px auto 0;
      position: relative;
    }

    /* ── MASONRY GRID ── */
    .moments-section {
      padding: 60px clamp(16px, 4vw, 60px) 80px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .masonry-grid {
      columns: 4 260px;
      column-gap: 20px;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 20px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: var(--white);
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
      transition: transform 0.32s var(--ease), box-shadow 0.32s var(--ease);
      animation: fadeUp 0.55s ease both;
    }
    .masonry-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 45px rgba(0,0,0,0.16);
    }
    .tile-img-wrap {
      position: relative;
      overflow: hidden;
    }
    .tile-img-wrap img {
      width: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.5s var(--ease);
    }
    .masonry-item:hover .tile-img-wrap img {
      transform: scale(1.05);
    }
    .tile-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,30,70,0.9) 0%,
        rgba(0,30,70,0.55) 40%,
        transparent 70%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px 16px;
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }
    .masonry-item:hover .tile-overlay { opacity: 1; }
    .tile-overlay-tag {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .tile-overlay-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .view-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--white);
      background: var(--gold);
      padding: 5px 13px;
      border-radius: 20px;
      width: fit-content;
      transform: translateY(6px);
      transition: transform 0.3s var(--ease);
      letter-spacing: 0.3px;
    }
    .masonry-item:hover .view-chip { transform: translateY(0); }
    .tile-info {
      padding: 13px 15px 15px;
    }
    .tile-info-title {
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .tile-info-cat {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--sky);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── MODAL ── */
    .moments-modal .modal-dialog { max-width: 760px; }
    .moments-modal .modal-content {
      border: none;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,0.35);
    }
    .moments-modal .modal-header {
      background: var(--navy);
      border: none;
      padding: 20px 28px 16px;
    }
    .moments-modal .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1.3;
    }
    .moments-modal .close {
      color: rgba(255,255,255,0.7);
      font-size: 1.6rem;
      transition: color 0.2s;
    }
    .moments-modal .close:hover { color: var(--white); }

    /* Slider */
    .media-slider-wrap {
      position: relative;
      background: #060a14;
      overflow: hidden;
    }
    .m-slide { display: none; }
    .m-slide.active { display: block; }
    .m-slide img {
      width: 100%;
      height: 400px;
      object-fit: contain;
      display: block;
    }
    .m-slide iframe {
      width: 100%;
      height: 400px;
      border: none;
      display: block;
    }
    .slider-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
    }
    .s-btn {
      pointer-events: all;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .s-btn:hover { background: rgba(255,255,255,0.28); }
    .slider-dots {
      position: absolute;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
    }
    .sdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .sdot.active { background: var(--gold); transform: scale(1.4); }

    .moments-modal .modal-body {
      padding: 26px 30px 30px;
      background: var(--white);
    }
    .event-metas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .emeta {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.8px; text-transform: uppercase;
      padding: 4px 11px; border-radius: 16px;
    }
    .emeta.ev  { background: rgba(0,68,137,0.09);   color: var(--navy); }
    .emeta.dt  { background: rgba(201,152,74,0.12); color: #8a6010; }
    .emeta.loc { background: rgba(0,135,202,0.09);  color: #006899; }
    .modal-desc {
      font-size: 0.95rem;
      line-height: 1.82;
      color: #3d3d50;
      font-weight: 300;
    }
    .modal-tags {
      margin-top: 18px;
      display: flex; flex-wrap: wrap; gap: 7px;
    }
    .mtag {
      font-size: 0.72rem; font-weight: 500;
      color: var(--sky);
      background: rgba(0,135,202,0.08);
      padding: 3px 11px;
      border-radius: 10px;
    }
    .modal-yt-link {
      margin-top: 20px; padding-top: 18px;
      border-top: 1px solid #edf0f4;
    }
    .yt-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #ff0000; color: white;
      font-size: 0.83rem; font-weight: 600;
      padding: 9px 20px; border-radius: 7px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .yt-btn:hover { background: #cc0000; color: white; text-decoration: none; }

    /* ── YT THUMBNAIL PREVIEW ── */
    .yt-preview-wrap {
      position: relative;
      cursor: pointer;
      display: block;
      background: #000;
    }
    .yt-preview-wrap img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s;
    }
    .yt-preview-wrap:hover img { opacity: 0.85; }
    .yt-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .yt-play-btn {
      width: 72px; height: 72px;
      background: rgba(255,0,0,0.92);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.9rem;
      color: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      transition: transform 0.2s, background 0.2s;
    }
    .yt-preview-wrap:hover .yt-play-btn {
      background: #ff0000;
      transform: scale(1.12);
    }
    @media (max-width: 768px) {
      .yt-preview-wrap img { height: 260px; }
    }

    /* ── PARALLAX ── */
    .parallax {
      background-image: url("images/speakerbottom.jpg");
      min-height: 350px;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* ── LOGO WATERMARK ── */
    .slide-logo {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 120px !important;
      height: auto !important;
      max-width: 120px !important;
      opacity: 0.85;
      pointer-events: none;
      z-index: 3;
      filter: brightness(0) invert(1) drop-shadow(0 1px 4px rgba(0,0,0,0.6));
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .masonry-item:nth-child(1)  { animation-delay: 0.04s; }
    .masonry-item:nth-child(2)  { animation-delay: 0.09s; }
    .masonry-item:nth-child(3)  { animation-delay: 0.14s; }
    .masonry-item:nth-child(4)  { animation-delay: 0.19s; }
    .masonry-item:nth-child(5)  { animation-delay: 0.24s; }
    .masonry-item:nth-child(6)  { animation-delay: 0.29s; }
    .masonry-item:nth-child(7)  { animation-delay: 0.34s; }
    .masonry-item:nth-child(8)  { animation-delay: 0.39s; }
    .masonry-item:nth-child(9)  { animation-delay: 0.44s; }
    .masonry-item:nth-child(10) { animation-delay: 0.49s; }

    @media (max-width: 992px) { .masonry-grid { columns: 3 220px; } }
    @media (max-width: 768px) {
      .masonry-grid { columns: 2 180px; }
      .m-slide img, .m-slide iframe { height: 260px; }
    }
    @media (max-width: 480px) { .masonry-grid { columns: 1; } }
  </style>
</head>

  /* ════════════ SLIDER STATE ════════════ */
  var currentSlide = 0;
  var currentMedia = [];

  function openMoment(id) {
    var m = moments.find(function(x) { return x.id === id; });
    currentMedia = m.media;
    currentSlide = 0;

    document.getElementById('momentModalTitle').textContent = m.title;

    document.getElementById('modalMetas').innerHTML =
      '<span class="emeta ev"><i class="fa fa-star"></i>&nbsp;' + m.category + '</span>' +
      '<span class="emeta dt"><i class="fa fa-calendar"></i>&nbsp;' + m.date + '</span>' +
      '<span class="emeta loc"><i class="fa fa-map-marker"></i>&nbsp;' + m.location + '</span>';

    document.getElementById('modalDesc').textContent = m.description;

    document.getElementById('modalTags').innerHTML =
      m.tags.map(function(t) { return '<span class="mtag">' + t + '</span>'; }).join('');

    document.getElementById('modalYt').innerHTML = m.youtubeLink
      ? '<div class="modal-yt-link"><a href="' + m.youtubeLink + '" target="_blank" class="yt-btn">' +
        '<i class="fa fa-youtube-play"></i>&nbsp;Watch on YouTube</a></div>'
      : '';

    renderSlider();
    $('#momentModal').modal('show');
  }

  function renderSlider() {
    var inner = document.getElementById('sliderInner');
    var dots  = document.getElementById('sliderDots');

    inner.innerHTML = currentMedia.map(function(item, i) {
      var activeClass = i === 0 ? ' active' : '';
      if (item.type === 'youtube') {
        var ytIdMatch = item.src.match(/embed\/([^?&]+)/);
        var ytId = ytIdMatch ? ytIdMatch[1] : '';
        var thumb = 'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg';
        return '<div class="m-slide' + activeClass + '">' +
               '<div class="yt-preview-wrap" data-ytid="' + ytId + '" onclick="loadYTIframe(this)" title="Watch on YouTube">' +
               '<img src="' + thumb + '" alt="YouTube Video Preview" onerror="ytThumbFallback(this,\'' + ytId + '\')">' +
               '<div class="yt-play-overlay">' +
               '<div class="yt-play-btn"><i class="fa fa-youtube-play" style="font-size:2rem;margin-right:2px;"></i></div>' +
               '</div>' +
               '<div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.85);font-size:0.78rem;font-weight:600;letter-spacing:0.5px;pointer-events:none;">Watch on YouTube</div>' +
               '</div></div>';
      }
      return '<div class="m-slide' + activeClass + '" style="position:relative;">' +
             '<img src="' + item.src + '" alt="Moment media">' +
             '<img class="slide-logo" src="./images/logo.png" alt="Logo"></div>';
    }).join('');

    dots.innerHTML = currentMedia.map(function(_, i) {
      return '<span class="sdot' + (i === 0 ? ' active' : '') +
             '" onclick="goSlide(' + i + ')"></span>';
    }).join('');

    var showNav = currentMedia.length > 1;
    document.getElementById('sPrev').style.display = showNav ? 'flex' : 'none';
    document.getElementById('sNext').style.display = showNav ? 'flex' : 'none';
  }

  function loadYTIframe(el) {
    var ytId = el.getAttribute('data-ytid');
    window.open('https://www.youtube.com/watch?v=' + ytId, '_blank');
  }

  function ytThumbFallback(img, ytId) {
    var fallbacks = ['mqdefault', 'sddefault', 'default'];
    var tried = parseInt(img.getAttribute('data-tried') || '0');
    if (tried < fallbacks.length) {
      img.setAttribute('data-tried', tried + 1);
      img.src = 'https://img.youtube.com/vi/' + ytId + '/' + fallbacks[tried] + '.jpg';
    } else {
      img.onerror = null;
      img.style.display = 'none';
    }
  }

  function goSlide(n) {
    var slides = document.querySelectorAll('#sliderInner .m-slide');
    var dots   = document.querySelectorAll('#sliderDots .sdot');

    currentSlide = ((n % currentMedia.length) + currentMedia.length) % currentMedia.length;
    slides.forEach(function(s, i) { s.classList.toggle('active', i === currentSlide); });
    dots.forEach(function(d, i)   { d.classList.toggle('active', i === currentSlide); });
  }

  document.getElementById('sPrev').addEventListener('click', function() { goSlide(currentSlide - 1); });
  document.getElementById('sNext').addEventListener('click', function() { goSlide(currentSlide + 1); });

  /* clear slider on modal close */
  $('#momentModal').on('hidden.bs.modal', function() {
    document.getElementById('sliderInner').innerHTML = '';
  });

  /* footer form */
  var form = document.getElementById('FooterForm');
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    Swal.fire('Submitted successfully', 'Thank you!', 'success');
    var data = new FormData(event.target);
    fetch(event.target.action, {
      method: form.method,
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(function(r) { if (r.ok) form.reset(); });
  });
  </script>
</body>
